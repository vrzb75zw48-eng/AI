# Cocos Creator 3.8.8 —— Windows runner：Web + Android
#
# 前置提醒：Cocos Creator CLI 需要 GUI/桌面会话。GitHub 托管的 windows-latest 以服务会话
# 运行，编辑器有可能起不来。若 android job 卡在 Cocos 那步，请改用 cocos-ci-android.yml
# （Intel macOS runner）。本文件保留为 Windows 方向的备选。
#
# 与 Android 相关的关键事实同 cocos-ci-android.yml：Gradle 根工程在
# <项目>/build/android/proj，AGP 8.10.1 + Gradle wrapper 8.11.1 + JDK 17，
# release 签名属性名 RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD /
# RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD，NDK 只能 r21~r22。
#
# 需配 Secrets：ANDROID_KEYSTORE（base64）/ ANDROID_KEYSTORE_PASSWORD /
#               ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# 可选 repo Variables：COCOS_WIN_ZIP（覆盖编辑器下载直链）

name: Cocos CI 3.8.8 (Windows - Web+Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "出什么包"
        type: choice
        options:
          - debug-apk
          - release-apk
          - aab
        default: debug-apk

env:
  COCOS_VERSION: "3.8.8"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_CMAKE: "3.22.1"
  NDK_VERSION: "21.4.7075529"

jobs:
  web:
    name: Web (web-mobile)
    runs-on: windows-latest
    env:
      COCOS_WIN_ZIP: ${{ vars.COCOS_WIN_ZIP || 'https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.zip' }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Cocos Creator 3.8.8
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/CocosCreator"
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cc.zip "$COCOS_WIN_ZIP"
            unzip -q /tmp/cc.zip -d "$APP_DIR"
            rm -f /tmp/cc.zip
          fi
          BIN="$APP_DIR/CocosCreator.exe"
          [ -f "$BIN" ] || { echo "::error::未找到 CocosCreator.exe（COCOS_WIN_ZIP 直链是否失效？）"; ls -l "$APP_DIR"; exit 1; }
          echo "CC_CREATOR=$BIN" >> "$GITHUB_ENV"

      - name: Build web-mobile
        shell: bash
        env:
          CC_PROJECT: ${{ github.workspace }}
        run: bash ./cocos-ci-build.sh web

      - name: 上传 web-mobile
        uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: build/web-mobile/

  android:
    name: Android (apk/aab)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      COCOS_WIN_ZIP: ${{ vars.COCOS_WIN_ZIP || 'https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-121518.zip' }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Cocos Creator 3.8.8
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/CocosCreator"
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cc.zip "$COCOS_WIN_ZIP"
            unzip -q /tmp/cc.zip -d "$APP_DIR"
            rm -f /tmp/cc.zip
          fi
          BIN="$APP_DIR/CocosCreator.exe"
          [ -f "$BIN" ] || { echo "::error::未找到 CocosCreator.exe（COCOS_WIN_ZIP 直链是否失效？）"; ls -l "$APP_DIR"; exit 1; }
          echo "CC_CREATOR=$BIN" >> "$GITHUB_ENV"

      - name: 解析 build_type
        shell: bash
        run: |
          BT="${{ inputs.build_type }}"
          [ -n "$BT" ] || BT="debug-apk"
          echo "BUILD_TYPE=$BT" >> "$GITHUB_ENV"

      - name: 装 JDK 17（AGP 8.10.1 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android cmdline-tools
        uses: android-actions/setup-android@v4

      - name: 装 Platform / Build-Tools / CMake / NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager.bat --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${NDK_VERSION}"
          # bash 侧统一用正斜杠路径（C:\Android\... → C:/Android/...）
          AH="$(printf '%s' "$ANDROID_HOME" | sed 's|\\|/|g')"
          echo "ANDROID_HOME=$AH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$AH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$AH/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 注入 release keystore
        if: env.BUILD_TYPE != 'debug-apk'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::缺 secret ANDROID_KEYSTORE（base64 后的 keystore）"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -l "$GITHUB_WORKSPACE/release.keystore"

      - name: Cocos 生成工程 + Gradle wrapper 出包
        shell: bash
        env:
          CC_PROJECT: ${{ github.workspace }}
          CC_BUILD_TYPE: ${{ env.BUILD_TYPE }}
          NDK_HOME: ${{ env.NDK_HOME }}
          NDK_VER: ${{ env.NDK_VERSION }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./cocos-ci-build.sh android

      - name: 校验并收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/android/proj/build -type f -path '*/outputs/*' \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo "::error::dist 为空，Gradle 输出路径不对？"; find build/android -maxdepth 4 -type d; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner.bat"
          for f in dist/*.apk; do
            [ -e "$f" ] || continue
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f"
            unzip -l "$f" | grep -E 'lib/[^/]+/libcocos\.so' || echo "::warning::$f 里没有 libcocos.so（ABI 是否被裁掉？）"
          done
          ls -lh dist

      - name: 上传 apk/aab
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_TYPE }}
          path: dist/
