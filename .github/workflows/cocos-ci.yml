# Cocos Creator 3.8.8 CI 出包（Web + Android + iOS），脱离 dev-cli 引擎 dev 容器
# 走 Cocos 编辑器官方 CLI build（成功退出码 36）；Android 由 Gradle wrapper 主导出包。
#
# 关键事实（cocos-engine v3.8.8 模板核实）：
#   - Gradle 根工程是 <项目>/build/android/proj（native/engine/android 只是 :app 模块）
#   - AGP 8.10.1 + Gradle wrapper 8.11.1 + JDK 17
#   - release 签名属性名 RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD /
#     RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
#   - APK/AAB 落在 build/android/proj/build/CocosGame/outputs/
#   - NDK 只能 r21~r22，且只有 x86_64 宿主工具链 → Android job 必须用 Intel runner
# 用法：放到 <repo>/.github/workflows/cocos-ci.yml；Cocos 工程放 $GITHUB_WORKSPACE 根。
# 需配 Secrets：
#   Android: ANDROID_KEYSTORE(base64) / ANDROID_KEYSTORE_PASSWORD /
#            ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   iOS:     CERT_P12(base64 p12) / CERT_P12_PASSWORD / PROVISION_PROFILE(base64)
name: Cocos CI 3.8.8

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Android 出什么包"
        type: choice
        options:
          - debug-apk
          - release-apk
          - aab
        default: debug-apk

env:
  COCOS_VERSION: "3.8.8"
  # 直链构建号 121518 已用 curl -I 验证有效（mac/win 均 200）
  COCOS_MAC_ZIP: "https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-mac-121518.zip"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_CMAKE: "3.22.1"
  NDK_VERSION: "21.4.7075529"

jobs:
  web:
    name: Web (web-mobile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 Cocos Creator 3.8.8
        run: |
          set -euo pipefail
          APP_DIR=/Applications/CocosCreator
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cc.zip "$COCOS_MAC_ZIP"
            ditto -x -k /tmp/cc.zip "$APP_DIR"
            rm -f /tmp/cc.zip
          fi
          BIN="$APP_DIR/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || BIN="$APP_DIR/CocosCreator/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || { echo "::error::未找到 CocosCreator.app"; ls -l "$APP_DIR"; exit 1; }
          chmod +x "$BIN"
          echo "CC_CREATOR=$BIN" >> "$GITHUB_ENV"
      - name: Build web-mobile
        env:
          CC_PROJECT: ${{ github.workspace }}
        run: bash ./cocos-ci-build.sh web
      - name: 上传 web-mobile
        uses: actions/upload-artifact@v4
        with:
          name: web-mobile
          path: build/web-mobile/

  android:
    name: Android (apk/aab)
    runs-on: macos-15-intel   # NDK r21/r22 无 darwin-arm64 宿主工具链，必须 Intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 解析 build_type
        run: |
          BT="${{ inputs.build_type }}"
          [ -n "$BT" ] || BT="debug-apk"
          echo "BUILD_TYPE=$BT" >> "$GITHUB_ENV"

      - name: 装 JDK 17（AGP 8.10.1 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android cmdline-tools
        uses: android-actions/setup-android@v4

      - name: 装 Platform / Build-Tools / CMake / NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE}" \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: 装 Cocos Creator 3.8.8
        run: |
          set -euo pipefail
          APP_DIR=/Applications/CocosCreator
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cc.zip "$COCOS_MAC_ZIP"
            ditto -x -k /tmp/cc.zip "$APP_DIR"
            rm -f /tmp/cc.zip
          fi
          BIN="$APP_DIR/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || BIN="$APP_DIR/CocosCreator/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || { echo "::error::未找到 CocosCreator.app"; ls -l "$APP_DIR"; exit 1; }
          chmod +x "$BIN"
          echo "CC_CREATOR=$BIN" >> "$GITHUB_ENV"

      - name: 注入 release keystore
        if: env.BUILD_TYPE != 'debug-apk'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::缺 secret ANDROID_KEYSTORE"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Cocos 生成工程 + Gradle wrapper 出包
        env:
          CC_PROJECT: ${{ github.workspace }}
          CC_BUILD_TYPE: ${{ env.BUILD_TYPE }}
          NDK_HOME: ${{ env.NDK_HOME }}
          NDK_VER: ${{ env.NDK_VERSION }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./cocos-ci-build.sh android

      - name: 校验并收集产物
        run: |
          set -euo pipefail
          mkdir -p dist
          find build/android/proj/build -type f -path '*/outputs/*' \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo "::error::dist 为空，Gradle 输出路径不对？"; exit 1; }
          for f in dist/*.apk; do
            [ -e "$f" ] || continue
            "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$f"
          done
          ls -lh dist

      - name: 上传 apk/aab
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_TYPE }}
          path: dist/

  ios:
    name: iOS (ipa)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # apple-actions/import-codesign-certs 同时处理 p12 与描述文件；
      # apple-actions/import-certificate、import-profile 并不存在。
      # secrets 上下文不能在步骤 if: 里用（actionlint 报错），先探测、再用 env 控制
      - name: 探测 iOS secrets 是否已配置
        env:
          P12: ${{ secrets.CERT_P12 }}
        run: echo "IOS_CERTS=${P12:+true}" >> "$GITHUB_ENV"

      - name: 导入 iOS 证书与描述文件
        if: env.IOS_CERTS == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
          provisioning-profile: ${{ secrets.PROVISION_PROFILE }}

      - name: 装 Cocos Creator 3.8.8
        run: |
          set -euo pipefail
          APP_DIR=/Applications/CocosCreator
          if [ ! -d "$APP_DIR" ]; then
            mkdir -p "$APP_DIR"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cc.zip "$COCOS_MAC_ZIP"
            ditto -x -k /tmp/cc.zip "$APP_DIR"
            rm -f /tmp/cc.zip
          fi
          BIN="$APP_DIR/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || BIN="$APP_DIR/CocosCreator/CocosCreator.app/Contents/MacOS/CocosCreator"
          [ -f "$BIN" ] || { echo "::error::未找到 CocosCreator.app"; ls -l "$APP_DIR"; exit 1; }
          chmod +x "$BIN"
          echo "CC_CREATOR=$BIN" >> "$GITHUB_ENV"

      - name: Build iOS（生成 Xcode 工程并编译）
        env:
          CC_PROJECT: ${{ github.workspace }}
        run: bash ./cocos-ci-build.sh ios

      - name: 导出 IPA
        run: |
          set -euo pipefail
          XCA="$(find build/ios -name '*.xcarchive' -print -quit)"
          [ -n "$XCA" ] || { echo "::error::未找到 xcarchive，检查 Cocos iOS 产物路径"; exit 1; }
          cat > export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$XCA" -optionsPlist export.plist -exportPath build/ios

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/*.ipa
